<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · AllyFind</title>
<!-- allyfind.com's own 404 page (.htaccess-allyfind: ErrorDocument 404 /404.html). Without it the host served its default
     error page, which loads the host's Google Analytics tag before any consent. No scripts, no third-party requests. -->
<style>
  :root{--bg:#fff;--fg:#1d1d2b;--muted:#5b5b6e;--accent:#e8590c}
  @media (prefers-color-scheme:dark){:root{--bg:#14141c;--fg:#f1f1f6;--muted:#a9a9bb;--accent:#ff8a3d}}
  body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  main{max-width:560px;margin:0 auto;padding:64px 16px}
  h1{font-size:28px;margin:0 0 8px}
  p{color:var(--muted);margin:0 0 18px}
  a{color:var(--accent);font-weight:600}
  .he{direction:rtl;text-align:right;margin-top:40px;padding-top:24px;border-top:1px solid rgba(127,127,127,.25)}
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>This page doesn't exist, or it has moved.</p>
  <p><a href="/">Go to today's deals</a></p>
  <div class="he" lang="he">
    <h1>הדף לא נמצא</h1>
    <p>הדף הזה לא קיים, או שהועבר למקום אחר.</p>
    <p><a href="/he/">לדילים של היום</a></p>
  </div>
</main>
</body>
</html>
