<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found — fashionhotspot</title>
<meta name="robots" content="noindex,follow">
<style>
  :root{--bg:#FFF6EE;--card:#fff;--ink:#2E1F26;--ink3:#6B5560;--accent:#C62F1C;
        --grad:linear-gradient(120deg,#FF5D5D,#FF8E72 45%,#FFC23C 90%)}
  @media(prefers-color-scheme:dark){:root{--bg:#0B0714;--card:#160A24;--ink:#F6F1FC;--ink3:#988CAC;--accent:#FF5D5D}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.6}
  .box{max-width:520px;text-align:center}
  .code{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  h1{font-size:clamp(26px,5vw,34px);line-height:1.15;letter-spacing:-.02em;margin-bottom:14px}
  p{color:var(--ink3);margin-bottom:26px}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;
    border-radius:12px;text-decoration:none;font-weight:700;font-size:14px}
  .primary{background:var(--grad);color:#2A1208}
  .ghost{border:1.5px solid var(--ink3);color:var(--ink)}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>That page isn’t here.</h1>
    <p>It may have moved, or the link might be mistyped. The buying guides and today’s deals are both a click away.</p>
    <div class="row">
      <a class="primary" href="/">Today’s deals</a>
      <a class="ghost" href="/posts.html">Buying guides</a>
    </div>
  </div>
</body>
</html>
